name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'install.sh'
      - 'CHANGELOG.md'
      - 'ROADMAP.md'
      - 'tasks/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel a running one: a half-published site
# must not become the documented origin.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The site is its own package. Its dependency tree is installed here and
      # nowhere near the binary's, which stays at four runtime dependencies.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.16
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
        working-directory: site

      # The installer is served from the site but lives at the repository root,
      # where CI tests it. Copied rather than duplicated: two copies of a script
      # people pipe into a shell is one copy too many.
      - run: cp install.sh site/public/install.sh

      # The changelog and roadmap pages read CHANGELOG.md and tasks/ from the
      # repository at build time, so the site cannot misreport what shipped.
      - run: bun run build
        working-directory: site

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/out
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
