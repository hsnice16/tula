name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.16
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: binary runs
        run: ./dist/tula --version
      # What ends up inside the binary is decided by what resolves at build
      # time, not by what src/ imports, so nothing above this line can see it.
      - run: bash scripts/binary-audit.sh dist/tula

      # The install path ships to users the same way the binary does, and it is
      # the one piece nothing else exercises until a tag is pushed.
      - run: bash scripts/install-test.sh
      - name: every release target still cross-compiles
        run: bash scripts/release-build.sh dist/release

  # The site is the published origin of install.sh and of every claim a reader
  # sees before installing anything. Vercel builds it too, but a preview that
  # fails is a link nobody opens; this fails the pull request itself.
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.16
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
        working-directory: site
      - run: bun run lint
        working-directory: site
      # The command Vercel runs, installer copy included, so CI cannot pass
      # against a build the deploy does differently — and only a real build
      # proves the page still renders.
      - run: bun run build
        working-directory: site
      # Three claims can only be read off Next's output, so they are pinned
      # against `site/out` and skip when it is absent — which is every other
      # job. This is the one place the build exists, so it is the one place
      # they are not silently skipped.
      - run: bun install --frozen-lockfile
      - run: bun test src/site-claims.test.ts

  no-execution-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # guard.sh is greps; guard-test.sh is not. Whether venue text in a tool
      # result carries its mark is a data-flow property, so the probe for it
      # plants a field and runs the check that catches one.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.16
      - run: bun install --frozen-lockfile
      - run: bash scripts/guard.sh
      - run: bash scripts/guard-test.sh

  # The commit hook is opt-in per clone and `--no-verify` skips it, so nothing
  # else looks at a contributor's branch. Staging the whole tree rather than a
  # diff makes this the stronger check of the two: it fails on a credential
  # already sitting in the files, not only on one being added.
  no-credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/scan-test.sh
      - name: no credential anywhere in the tree
        run: |
          set -euo pipefail
          # The history is discarded first, and that is the whole trick: the hook
          # reads `git diff --cached`, so against a checkout whose index already
          # matches HEAD it stages nothing and passes having read no file at all.
          # Re-initialised, every tracked file is an addition and the scan sees
          # the tree entire.
          rm -rf .git
          git init -q
          git config user.email ci@example.invalid
          git config user.name ci
          git add -A
          test "$(git diff --cached --name-only | wc -l)" -gt 0 || {
            echo "staged nothing; the scan below would pass without reading a file" >&2
            exit 1
          }
          bash .githooks/scan-staged
