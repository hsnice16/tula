name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.16
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: binary runs
        run: ./dist/tula --version

      # The install path ships to users the same way the binary does, and it is
      # the one piece nothing else exercises until a tag is pushed.
      - run: bash scripts/install-test.sh
      - name: every release target still cross-compiles
        run: bash scripts/release-build.sh dist/release

  no-execution-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: bash scripts/guard.sh
