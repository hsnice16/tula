name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish for real. Off = dry run: build, sign and verify only, publishing nothing.'
        type: boolean
        default: false
      promote_stable:
        description: 'Also bump the stable Homebrew formula (only with publish)'
        type: boolean
        default: false

permissions:
  contents: read

# Never two releases at once, and never cancel one in flight: a half-published
# release is a set of channels disagreeing about what the current binary is.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Publishing waits for a human. The environment is declared here so the
    # gate is part of the workflow rather than a setting somebody has to know
    # exists; it does nothing until `release` is given a required reviewer in
    # Settings -> Environments, and then no branch can publish unreviewed.
    environment: release
    # macOS, because signing has to happen on it and Bun cross-compiles every
    # other target from here anyway. One job means the artifact that gets
    # attested is provably the artifact that got built and signed — no handoff
    # in between where a checksum could be recomputed over something else.
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      # No push here uses the checkout's credentials — `gh release create`
      # and the tap clone each carry their own token — so leaving one in
      # .git/config only widens what a later step in the job can read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so the step below can ask whether the commit
          # being released is on main. A shallow checkout cannot answer that.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.16

      # A tag that disagrees with src/version.ts publishes one number to npm and
      # a different one to `tula --version`. Caught before anything is built.
      - id: version
        name: tag agrees with src/version.ts
        run: |
          set -euo pipefail
          app=$(grep -m1 'APP_VERSION' src/version.ts | sed "s/.*'\([^']*\)'.*/\1/")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$tag" != "$app" ]; then
            echo "tag v$tag does not match src/version.ts ($app)" >&2
            exit 1
          fi
          echo "version=$app" >>"$GITHUB_OUTPUT"
          case "$app" in
            *-*) echo "prerelease=true" >>"$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >>"$GITHUB_OUTPUT" ;;
          esac

          # A tag push publishes. A manual run does not, unless it says so:
          # GITHUB_REF_TYPE is `branch` there, so the tag check above cannot
          # protect it, and every step below would otherwise cut a real release
          # from whatever happens to be on the branch.
          if [ "$GITHUB_REF_TYPE" = tag ] || [ "${{ inputs.publish }}" = true ]; then
            echo "publish=true" >>"$GITHUB_OUTPUT"
          else
            echo "publish=false" >>"$GITHUB_OUTPUT"
            echo "::notice::Dry run — building and verifying everything, publishing nothing."
          fi

      # The attestation every install verifies is bound to this file's *path* —
      # `--signer-workflow <repo>/.github/workflows/release.yml` — and a tag can
      # point at any commit, including one that was never on main and that
      # rewrote this workflow. Anything published from here has to be reachable
      # from main, or the provenance proves only that some version of this file
      # ran. It runs before anything is built, so an off-main tag costs a minute
      # rather than a release.
      - name: what is being released is on main
        if: steps.version.outputs.publish == 'true'
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main;" \
              "an attestation minted here would name this workflow's path from a" \
              "tree nobody reviewed." >&2
            exit 1
          }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      # The same gate every pull request passes. A release is the last place to
      # discover the guard was failing.
      - run: bun run check

      - run: bash scripts/release-build.sh dist/release

      # ------------------------------------------------------------- signing --
      #
      # Gated on the certificate being configured rather than assumed: an
      # unsigned build still installs correctly through curl and Homebrew,
      # neither of which quarantines what it downloads. Once the secrets exist
      # this stops being optional — there is no continue-on-error below, so a
      # signing failure fails the release.
      - id: signing
        # Whether the secret is set, never the secret itself: `${{ }}` expands
        # before the shell exists, so naming it here would write the whole
        # base64 certificate into a script file on the runner.
        env:
          HAS_CERT: ${{ secrets.APPLE_CERT_P12 != '' }}
        run: |
          if [ "$HAS_CERT" = true ]; then
            echo "configured=true" >>"$GITHUB_OUTPUT"
          else
            echo "configured=false" >>"$GITHUB_OUTPUT"
            echo "::warning::Apple signing is not configured; macOS binaries ship unsigned."
          fi

      - name: sign and notarize macOS binaries
        if: steps.signing.outputs.configured == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          set -euo pipefail
          keychain=$RUNNER_TEMP/build.keychain
          # A trap, not a line at the end: `delete-keychain` was reached only on
          # the happy path, so a failure anywhere in the loop below left the
          # keychain unlocked and in the search list for every later step, and
          # left the decoded certificate and API key sitting in $RUNNER_TEMP for
          # the life of the job. Runners are ephemeral; the rest of this job is
          # not, and it clones a tap and publishes with tokens of its own.
          cleanup() {
            security list-keychains -d user -s login.keychain 2>/dev/null || true
            security delete-keychain "$keychain" 2>/dev/null || true
            rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/key.p8"
          }
          trap cleanup EXIT
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$CERT_P12" | base64 --decode >"$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain

          echo "$API_KEY_P8" | base64 --decode >"$RUNNER_TEMP/key.p8"

          for arch in arm64 x64; do
            work=$RUNNER_TEMP/sign-$arch
            mkdir -p "$work"
            tar -xzf "dist/release/tula-v$VERSION-darwin-$arch.tar.gz" -C "$work"
            codesign --force --timestamp --options runtime \
              --sign "$SIGNING_IDENTITY" "$work/tula"
            codesign --verify --strict --verbose=2 "$work/tula"

            # notarytool takes an archive, not a bare executable.
            ditto -c -k "$work/tula" "$work/tula.zip"
            xcrun notarytool submit "$work/tula.zip" --wait \
              --key "$RUNNER_TEMP/key.p8" --key-id "$API_KEY_ID" --issuer "$API_ISSUER"
            # No `stapler staple`: a ticket can only be attached to a bundle,
            # disk image or installer package. For a bare Mach-O the notarization
            # is recorded with Apple and checked online, which is what Gatekeeper
            # does for one of these anyway.
            rm "$work/tula.zip"

            touch -t 197001010000 "$work/tula" "$work/LICENSE"
            tar --uid 0 --gid 0 --uname "" --gname "" \
              -cf - -C "$work" tula LICENSE |
              gzip -n >"dist/release/tula-v$VERSION-darwin-$arch.tar.gz"
          done

      # Signing rewrote two archives, so every checksum is recomputed here
      # rather than earlier. This file is what the installer checks against.
      - name: checksums
        run: |
          set -euo pipefail
          cd dist/release
          rm -f checksums.txt
          shasum -a 256 ./*.tar.gz | sed 's| \./| |' >checksums.txt
          cat checksums.txt

      # After signing and after the checksums, not before either. Run earlier it
      # proved the installer against archives that no longer existed by the time
      # anybody could download them — signing rewrites two of them, and the file
      # the installer checks against is written above.
      - run: bash scripts/install-test.sh

      # And the archives themselves, as they will ship: the checksums a user
      # verifies, and a binary that starts. A signed Mach-O that Gatekeeper or a
      # bad re-tar has broken passes every check above and fails on first run.
      - name: the shipped archives verify and run
        run: |
          set -euo pipefail
          cd dist/release
          shasum -a 256 -c checksums.txt
          work=$(mktemp -d)
          tar -xzf "tula-v${{ steps.version.outputs.version }}-darwin-arm64.tar.gz" -C "$work"
          "$work/tula" --version
          rm -rf "$work"

      # Signed by GitHub's workflow identity through sigstore: keyless, so there
      # is no signing key for this project to generate, publish, rotate or lose.
      # The subjects are the archives, which is what install.sh verifies.
      #
      # Gated with the publish steps, not run alongside them. An attestation is
      # a public transparency-log entry, and `install.sh` pins the signing
      # workflow but not the ref it ran from — so a dry run would mint proof
      # that a build from an arbitrary branch came from this workflow, which is
      # indistinguishable from a released one at the only place anybody checks.
      # The cost is that a dry run no longer exercises this step; the first real
      # tag does, before any channel points at it.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: steps.version.outputs.publish == 'true'
        with:
          subject-path: 'dist/release/*.tar.gz'

      - name: create the release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          site=$(grep -m1 'SITE_URL' src/version.ts | sed "s/.*'\([^']*\)'.*/\1/")
          notes=$RUNNER_TEMP/notes.md
          {
            echo "## Install"
            echo
            echo '```bash'
            echo "curl --proto '=https' --tlsv1.2 -LsSf $site/install.sh | sh"
            echo '```'
            echo
            echo "Pin this version: \`TULA_VERSION=$VERSION\`"
            echo
            echo "## Verify"
            echo
            # "present and signed in": install.sh treats a gh that is present
            # but not authenticated exactly as an absent one — it installs and
            # says provenance was not proven. This copy is the body of every
            # release, which is where people read it.
            echo "Every archive carries a sigstore-backed build attestation. The installer"
            echo "checks it automatically where the GitHub CLI is present and signed in, and"
            echo "says plainly that provenance was not proven where it is not. By hand:"
            echo
            echo '```bash'
            # --signer-workflow, not just --repo: --repo alone accepts an
            # attestation from any workflow here, and this is the copy people
            # paste. SECURITY.md says the flag is not optional; so does this.
            echo "gh attestation verify tula-v$VERSION-darwin-arm64.tar.gz --repo $GITHUB_REPOSITORY \\"
            echo "  --signer-workflow $GITHUB_REPOSITORY/.github/workflows/release.yml"
            echo '```'
            echo
            echo "Changelog: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/v$VERSION/CHANGELOG.md"
          } >"$notes"
          gh release create "v$VERSION" dist/release/* \
            --title "tula v$VERSION" \
            --notes-file "$notes" \
            $([ "$PRERELEASE" = true ] && echo --prerelease || echo --latest)

      # A skipped job looks exactly like a green release, while the install
      # page still tells people to use the channel that did not publish.
      - name: channels
        if: steps.version.outputs.publish == 'true'
        env:
          NPM: ${{ vars.PUBLISH_NPM }}
          HOMEBREW: ${{ vars.PUBLISH_HOMEBREW }}
        run: |
          for channel in "npm:$NPM" "Homebrew:$HOMEBREW"; do
            [ "${channel#*:}" = true ] ||
              echo "::warning::${channel%%:*} is off; the install page still tells people to use it."
          done

      # Uploaded on a dry run too: the artifacts and their checksums are the
      # thing you wanted to look at.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: dist/release

  npm:
    needs: release
    runs-on: ubuntu-latest
    # The reviewer gate, as on `release` above.
    environment: release
    # `npm publish --provenance` mints an OIDC token, which the top-level
    # contents:read does not allow. The release job grants itself this and this
    # one does not inherit it.
    permissions:
      id-token: write
    # Skipped rather than failed when npm is not configured: the GitHub release
    # is already published and correct, and a missing token is a setup gap, not
    # a bad build. The same tag can be re-run once the token exists.
    if: ${{ needs.release.outputs.publish == 'true' && vars.PUBLISH_NPM == 'true' }}
    steps:
      # No push here uses the checkout's credentials either.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.16
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist/release
      - run: bash scripts/npm-pack.sh dist/release dist/npm
      - name: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          tag=$([ "$PRERELEASE" = true ] && echo next || echo latest)
          # Already-published versions are skipped rather than retried. npm
          # refuses to publish over one, and under `set -e` that aborts the whole
          # job — so a run that failed part-way through, as v0.1.0's did on a
          # token that could not bypass 2FA, could not simply be re-run. It died
          # on the first package that had landed, leaving the rest unpublished
          # and the install page naming a channel that 404s.
          publish() {
            name=$(node -p "require('./$1/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "::notice::$name@$VERSION is already published; skipping"
              return 0
            fi
            npm publish "$1" --access public --provenance --tag "$2"
          }
          # Platform packages first: the wrapper's optionalDependencies name
          # them, and a wrapper published ahead of them installs a placeholder.
          for pkg in dist/npm/tula-*; do
            publish "$pkg" "$tag"
          done
          publish dist/npm/tula "$tag"

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    # The reviewer gate, as on `release` above.
    environment: release
    if: ${{ needs.release.outputs.publish == 'true' && vars.PUBLISH_HOMEBREW == 'true' }}
    steps:
      # No push here uses the checkout's credentials either.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
          path: dist/release

      - name: render and push formulae
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
          PROMOTE: ${{ inputs.promote_stable }}
        run: |
          set -euo pipefail
          # The token goes in a header, not the remote URL: a URL credential is
          # written into tap/.git/config, where every later command in this step
          # — including the formula scripts below — can read it back.
          auth=$(printf 'x-access-token:%s' "$TAP_TOKEN" | base64 | tr -d '\n')
          # GitHub masks the secret, not this derivation of it, and a usable
          # credential in a public log is the same credential.
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=Authorization: Basic $auth" \
            clone --depth 1 https://github.com/hsnice16/homebrew-tap.git tap
          mkdir -p tap/Formula

          # Every release moves the rolling channel.
          bash scripts/homebrew-formula.sh dist/release tula-latest \
            >tap/Formula/tula-latest.rb

          # And leaves a pinned name behind it. A formula holds one version, so
          # this file is the only way back to this build once the channels have
          # moved past it — the tap keeps them all, the way ~/.tula/versions does.
          bash scripts/homebrew-formula.sh dist/release "tula@$VERSION" \
            >"tap/Formula/tula@$VERSION.rb"

          # Stable lags deliberately: a plain tag promotes, a pre-release never
          # does, and a build discovered to be wrong is skipped by promoting the
          # next one instead of this one.
          if [ "$PRERELEASE" = false ] || [ "$PROMOTE" = true ]; then
            bash scripts/homebrew-formula.sh dist/release tula >tap/Formula/tula.rb
          fi

          cd tap
          git config user.name 'tula release'
          git config user.email 'noreply@github.com'
          git add Formula
          git diff --cached --quiet && { echo "formulae unchanged"; exit 0; }
          git commit -m "tula $VERSION"
          git -c "http.https://github.com/.extraheader=Authorization: Basic $auth" \
            push -u origin HEAD
